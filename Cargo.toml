[workspace]
resolver = "3"
members = [
    "crates/oscq-core",
    "crates/oscq-discovery",
    "crates/oscq-inspector",
]

# One version for every crate and for the release tag, checked by ci/check-release-version.sh.
[workspace.package]
version = "0.4.0"
authors = ["Julien Bayle"]
license = "GPL-3.0-or-later"
repository = "https://github.com/gluon/oscq-inspector"

[workspace.dependencies]
flume = { version = "0.12.0", default-features = false, features = ["async", "select"] }

[workspace.lints.clippy]
unwrap_used = "deny"
