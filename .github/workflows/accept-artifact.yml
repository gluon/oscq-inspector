name: Accept artifact

# Runs ci/accept-artifact.sh on macOS against the Release, or the draft, of a tag: the checks of
# docs/acceptance.md section 0 that need no person. By hand, with any tag; on a push that changes
# the script or this workflow, against the tag of the workspace version.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag whose Release or draft to check, v followed by the version"
        required: true
  push:
    branches: ["**"]
    paths:
      - "ci/accept-artifact.sh"
      - ".github/workflows/accept-artifact.yml"

# A draft Release is listed only to a token that may write to the repository. Nothing in this
# workflow writes: it downloads the draft's files and checks them.
permissions:
  contents: write

jobs:
  macos:
    name: Accept the macOS artifact
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # The copy each refusal maltreats, and its bundle.
      COPY: maltreated
      APP: maltreated/OSCQuery Inspector.app
    steps:
      - uses: actions/checkout@v5
        with:
          # The tag, whose license texts the bundle's are compared with.
          fetch-depth: 0

      - name: The tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then t="$INPUT_TAG"; else t="v$(./ci/release-version.sh)"; fi
          echo "tag=$t" >> "$GITHUB_OUTPUT"

      - name: Accept the files of the tag's Release
        shell: bash
        run: ./ci/accept-artifact.sh "${{ steps.tag.outputs.tag }}"

      # A check that has never failed proves nothing (CLAUDE.md law 12). Each step below gives the
      # script what one of its checks must refuse, and requires it to stop at that check and at no
      # other: ci/expect-refusal.sh fails unless the one FAIL line holds the expected text. The
      # bundle ones work on a copy of the tag's macOS bundle, maltreated once.
      - name: The bundle to maltreat
        shell: bash
        run: |
          gh release download "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern "*-macos-universal.zip" --dir zip
          ditto -x -k zip/*.zip bundle
          ls bundle

      - name: Refused, a tag this checkout does not hold
        shell: bash
        run: ./ci/expect-refusal.sh "is not in this checkout" ./ci/accept-artifact.sh v9.9.9

      - name: Refused, the files of another version, v0.2.3 named void-oscq
        shell: bash
        run: ./ci/expect-refusal.sh "the release holds" ./ci/accept-artifact.sh v0.2.3

      - name: Refused, a directory with no bundle
        shell: bash
        run: |
          mkdir -p empty
          ./ci/expect-refusal.sh "no OSCQuery Inspector.app in" ./ci/accept-artifact.sh --dir empty "${{ steps.tag.outputs.tag }}"

      - name: Refused, a bundle with no Info.plist
        shell: bash
        run: |
          rm -rf "$COPY" && ditto bundle "$COPY"
          rm "$APP/Contents/Info.plist"
          ./ci/expect-refusal.sh "no Contents/Info.plist in the bundle" ./ci/accept-artifact.sh --dir "$COPY" "${{ steps.tag.outputs.tag }}"

      - name: Refused, CFBundleShortVersionString of another version
        shell: bash
        run: |
          rm -rf "$COPY" && ditto bundle "$COPY"
          plutil -replace CFBundleShortVersionString -string 9.9.9 "$APP/Contents/Info.plist"
          ./ci/expect-refusal.sh 'CFBundleShortVersionString is "9.9.9", not' ./ci/accept-artifact.sh --dir "$COPY" "${{ steps.tag.outputs.tag }}"

      - name: Refused, CFBundleVersion of another version
        shell: bash
        run: |
          rm -rf "$COPY" && ditto bundle "$COPY"
          plutil -replace CFBundleVersion -string 9.9.9 "$APP/Contents/Info.plist"
          ./ci/expect-refusal.sh 'CFBundleVersion is "9.9.9", not' ./ci/accept-artifact.sh --dir "$COPY" "${{ steps.tag.outputs.tag }}"

      - name: Refused, no executable
        shell: bash
        run: |
          rm -rf "$COPY" && ditto bundle "$COPY"
          rm "$APP/Contents/MacOS/oscq-inspector"
          ./ci/expect-refusal.sh "is missing or not executable" ./ci/accept-artifact.sh --dir "$COPY" "${{ steps.tag.outputs.tag }}"

      - name: Refused, a binary of one architecture
        shell: bash
        run: |
          rm -rf "$COPY" && ditto bundle "$COPY"
          lipo "$APP/Contents/MacOS/oscq-inspector" -thin arm64 -output thin
          mv thin "$APP/Contents/MacOS/oscq-inspector"
          lipo -archs "$APP/Contents/MacOS/oscq-inspector"
          ./ci/expect-refusal.sh "the binary holds arm64, not arm64 and x86_64" ./ci/accept-artifact.sh --dir "$COPY" "${{ steps.tag.outputs.tag }}"

      - name: Refused, a font license missing
        shell: bash
        run: |
          rm -rf "$COPY" && ditto bundle "$COPY"
          rm "$APP/Contents/Resources/licenses/fonts/OFL.txt"
          ./ci/expect-refusal.sh "licenses/fonts/OFL.txt is missing" ./ci/accept-artifact.sh --dir "$COPY" "${{ steps.tag.outputs.tag }}"

      - name: Refused, a license that differs from the tag's
        shell: bash
        run: |
          rm -rf "$COPY" && ditto bundle "$COPY"
          echo "altered" >> "$APP/Contents/Resources/licenses/LICENSE"
          ./ci/expect-refusal.sh "licenses/LICENSE differs from LICENSE at" ./ci/accept-artifact.sh --dir "$COPY" "${{ steps.tag.outputs.tag }}"

      - name: Refused, one font license more than the tag's
        shell: bash
        run: |
          rm -rf "$COPY" && ditto bundle "$COPY"
          cp "$APP/Contents/Resources/licenses/fonts/OFL.txt" "$APP/Contents/Resources/licenses/fonts/extra.txt"
          ./ci/expect-refusal.sh "font licenses in the bundle, not the" ./ci/accept-artifact.sh --dir "$COPY" "${{ steps.tag.outputs.tag }}"

      # The real application, stopped before the quit event: it cannot handle the event, as an
      # application that hangs.
      - name: Refused, an application that does not quit
        shell: bash
        run: |
          rm -rf "$COPY" && ditto bundle "$COPY"
          ACCEPT_ARTIFACT_BEFORE_QUIT="kill -STOP" ./ci/expect-refusal.sh "still running 15 s after the quit event" ./ci/accept-artifact.sh --dir "$COPY" "${{ steps.tag.outputs.tag }}"
          if pgrep -f "$COPY/OSCQuery Inspector.app/Contents/MacOS/oscq-inspector"; then echo "FAIL: left running"; exit 1; fi

      # The real application, killed before the quit event: it ends without its own shutdown.
      - name: Refused, an application that ends with a status other than 0
        shell: bash
        run: |
          rm -rf "$COPY" && ditto bundle "$COPY"
          ACCEPT_ARTIFACT_BEFORE_QUIT="kill -KILL" ./ci/expect-refusal.sh "it quit with status 137, not 0" ./ci/accept-artifact.sh --dir "$COPY" "${{ steps.tag.outputs.tag }}"

      - name: Refused, a tag that does not name a version
        shell: bash
        run: ./ci/expect-refusal.sh "is not v followed by a version" ./ci/accept-artifact.sh 0.3.0

      # v0.2.2 is a tag of this repository with no Release.
      - name: Refused, a tag with no Release
        shell: bash
        run: ./ci/expect-refusal.sh "no release or draft of v0.2.2" ./ci/accept-artifact.sh v0.2.2

      - name: Refused, a version key absent
        shell: bash
        run: |
          rm -rf "$COPY" && ditto bundle "$COPY"
          plutil -remove CFBundleShortVersionString "$APP/Contents/Info.plist"
          ./ci/expect-refusal.sh "no CFBundleShortVersionString in Info.plist" ./ci/accept-artifact.sh --dir "$COPY" "${{ steps.tag.outputs.tag }}"

      - name: Refused, no CFBundleExecutable
        shell: bash
        run: |
          rm -rf "$COPY" && ditto bundle "$COPY"
          plutil -remove CFBundleExecutable "$APP/Contents/Info.plist"
          ./ci/expect-refusal.sh "no CFBundleExecutable in Info.plist" ./ci/accept-artifact.sh --dir "$COPY" "${{ steps.tag.outputs.tag }}"

      - name: Refused, no CFBundleIdentifier
        shell: bash
        run: |
          rm -rf "$COPY" && ditto bundle "$COPY"
          plutil -remove CFBundleIdentifier "$APP/Contents/Info.plist"
          ./ci/expect-refusal.sh "no CFBundleIdentifier in Info.plist" ./ci/accept-artifact.sh --dir "$COPY" "${{ steps.tag.outputs.tag }}"

      # The real application, stopped as soon as started: it draws nothing, as one that hangs at
      # its start.
      - name: Refused, an application that never draws its first frame
        shell: bash
        run: |
          rm -rf "$COPY" && ditto bundle "$COPY"
          ACCEPT_ARTIFACT_AFTER_START="kill -STOP" ./ci/expect-refusal.sh "no first frame within 30 s" ./ci/accept-artifact.sh --dir "$COPY" "${{ steps.tag.outputs.tag }}"
          if pgrep -f "$COPY/OSCQuery Inspector.app/Contents/MacOS/oscq-inspector"; then echo "FAIL: left running"; exit 1; fi

      # The real application, killed as soon as started: gone before its first frame.
      - name: Refused, an application that ends before its first frame
        shell: bash
        run: |
          rm -rf "$COPY" && ditto bundle "$COPY"
          ACCEPT_ARTIFACT_AFTER_START="kill -KILL" ./ci/expect-refusal.sh "it exited before its first frame" ./ci/accept-artifact.sh --dir "$COPY" "${{ steps.tag.outputs.tag }}"

      # Simulated: an osascript that fails, first on the PATH, as one the system refused to run;
      # the application, never told to quit, is ended by the script's cleanup.
      - name: Refused, a quit event that cannot be sent (simulated)
        shell: bash
        run: |
          rm -rf "$COPY" && ditto bundle "$COPY"
          mkdir -p fakebin
          printf '#!/bin/sh\necho "osascript: simulated refusal" >&2\nexit 1\n' > fakebin/osascript
          chmod +x fakebin/osascript
          PATH="$PWD/fakebin:$PATH" ./ci/expect-refusal.sh "the quit event could not be sent" ./ci/accept-artifact.sh --dir "$COPY" "${{ steps.tag.outputs.tag }}"
          sleep 1
          if pgrep -f "$COPY/OSCQuery Inspector.app/Contents/MacOS/oscq-inspector"; then echo "FAIL: left running"; exit 1; fi

      # The one bundle the refusals were made from passes, in the directory mode they used.
      - name: Accepted, the unmaltreated bundle in directory mode
        shell: bash
        run: ./ci/accept-artifact.sh --dir bundle "${{ steps.tag.outputs.tag }}"

